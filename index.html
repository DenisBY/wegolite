<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wegolite — foundation build</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #view {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* The HUD is a Canvas2D overlay above the WebGL canvas (D-05). */
      #hud {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      #overlay {
        position: absolute;
        top: 1rem;
        left: 1rem;
        color: #cfc;
        font: 13px/1.4 monospace;
        pointer-events: none;
      }

      #status,
      #stats {
        pointer-events: none;
      }

      #stats {
        color: #8a8;
      }

      #title-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: radial-gradient(circle at 50% 40%, #04120a, #000 70%);
        color: #33ff66;
        font: 20px/1.5 monospace;
      }

      #title-screen h1 {
        margin: 0;
        font-size: 48px;
        letter-spacing: 0.12em;
      }

      #title-screen button {
        padding: 0.6rem 2.4rem;
        border: 1px solid #33ff66;
        border-radius: 0;
        background: transparent;
        color: #33ff66;
        font: inherit;
        cursor: pointer;
      }

      #title-screen button:hover,
      #title-screen button:focus-visible {
        background: #33ff66;
        color: #000;
      }

      #docked {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 8, 3, 0.88);
        color: #33ff66;
        font: 18px/1.7 monospace;
      }

      #docked .panel {
        min-width: 22rem;
        padding: 1.5rem 2rem;
        border: 1px solid #33ff66;
        background: rgba(0, 0, 0, 0.7);
      }

      #docked h2 {
        margin: 0 0 1rem;
        font-size: 24px;
        letter-spacing: 0.08em;
      }

      #docked dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 1.5rem;
        margin: 0 0 1.5rem;
      }

      #docked dt {
        opacity: 0.7;
      }

      #docked dd {
        margin: 0;
      }

      #docked button {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #33ff66;
        background: transparent;
        color: #33ff66;
        font: inherit;
        cursor: pointer;
      }

      #docked button:hover,
      #docked button:focus-visible {
        background: #33ff66;
        color: #000;
      }

      #failure {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #000;
        color: #ffb3b3;
        font: 16px/1.6 monospace;
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      /* Fixed to the bottom so `overflow: hidden` on body cannot clip it. */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0.35rem 1rem;
        background: rgba(0, 0, 0, 0.8);
        color: #9a9;
        font: 12px/1.4 monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="hud" aria-hidden="true"></canvas>
    <div id="overlay">
      <div id="title">Wegolite — foundation build</div>
      <div id="status"></div>
      <div id="stats"></div>
    </div>
    <div id="title-screen">
      <h1>Wegolite</h1>
      <button id="title-start" type="button">Start</button>
    </div>
    <div id="docked" hidden>
      <section class="panel" aria-labelledby="docked-title">
        <h2 id="docked-title">Docked</h2>
        <dl>
          <dt>System</dt>
          <dd data-field="system"></dd>
          <dt>Credits</dt>
          <dd data-field="credits"></dd>
          <dt>Ship</dt>
          <dd data-field="ship"></dd>
          <dt>Fuel</dt>
          <dd data-field="fuel"></dd>
        </dl>
        <button type="button" data-action="launch">Launch</button>
      </section>
    </div>
    <div id="failure" role="alert" hidden></div>
    <footer>
      Wegolite is an unofficial fan project. Not affiliated with, endorsed by,
      or connected to the Oolite project, Frontier Developments plc, David
      Braben or Ian Bell. Elite and Cobra are trademarks of Frontier
      Developments plc.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
