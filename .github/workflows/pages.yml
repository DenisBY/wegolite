name: pages

# The deploy follows a successful `verify` run on `main`, so a commit that fails
# the full gate is never published. `workflow_dispatch` stays as the manual
# override for republishing the current `main`.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: the default is read-only. A job-level `permissions:` block
# replaces this set (it does not merge), so each job lists every scope it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # `verify` also runs on pull requests; only its push runs may publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # checkout reads the repository. configure-pages reads the Pages site
    # (GET /repos/{owner}/{repo}/pages needs Pages read; it would create a site
    # only with its enablement input on, which stays off). upload-pages-artifact
    # uploads through the Actions runtime token and needs no GITHUB_TOKEN scope.
    # This job runs the npm build, so it gets no write scope and cannot mint an
    # OIDC token.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit the gate passed, not a later `main`.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # No step fetches or pushes with git auth, and compose bind-mounts the
          # workspace into every container, so keep the job token out of
          # .git/config.
          persist-credentials: false
      - name: Build the production bundle in Docker
        run: docker compose run --rm e2e sh -lc "npm run build && npm run check:dist"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job publishes: deploy-pages creates the Pages deployment (Pages
    # write) and proves its origin with an OIDC token (id-token write). It checks
    # out nothing, so it gets no contents scope.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
