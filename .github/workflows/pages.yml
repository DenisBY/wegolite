name: pages

# The deploy follows a successful `verify` run on `main`, so a commit that fails
# the full gate is never published. `workflow_dispatch` stays as the manual
# override for republishing the current `main`.
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # `verify` also runs on pull requests; only its push runs may publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit the gate passed, not a later `main`.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build the production bundle in Docker
        run: docker compose run --rm e2e sh -lc "npm run build"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
