name: wegolite

# One shared workspace definition (D-04, PATTERNS §2 Pattern 2). EVERY command
# service inherits it — including the bind mount and the named node_modules
# volume — because `docker compose run` does not rebuild: without the mount it
# would verify stale image content instead of the working tree.
#
# `ci` is a Dockerfile stage and the image tag `wegolite-ci`, NOT a Compose
# service. `docker compose run` resolves service names only, so one-off tools
# run either through a declared service with a command override
# (`docker compose run --rm lint npx prettier --write .`) or directly against
# the image (`docker run --rm wegolite-ci <cmd>`). Never name `ci` as a run
# target.
#
# After any package.json / package-lock.json change run
# `docker compose down --volumes` (not just `build`): a named volume is
# populated from the image exactly once and otherwise keeps its old contents.
x-workspace: &workspace
  build:
    context: .
    target: ci
  image: wegolite-ci
  init: true
  volumes:
    - .:/app
    - wegolite-node-modules:/app/node_modules

services:
  app:
    <<: *workspace
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]

  preview:
    <<: *workspace
    ports:
      - "4173:4173"
    # FOUND-02: `up preview` serves the production bundle, so build first.
    command: ["sh", "-lc", "npm run build && npm run preview"]

  test:
    <<: *workspace
    command: ["npm", "test"]

  e2e:
    <<: *workspace
    # Playwright recommends --ipc=host for Chromium: without it the browser can
    # run out of shared memory and crash.
    ipc: host
    # `vite preview` serves dist/, so the bundle must exist before the browser
    # test starts. The WR-04 seam spec has its own config and its own test-only
    # build, so it runs as a separate step instead of forcing every Playwright
    # invocation to build the seam bundle.
    command:
      - sh
      - -lc
      - >-
        npm run build &&
        npm run test:e2e &&
        npm run test:e2e:seams

  # D-09: the Firefox gate. Deliberately NOT part of `verify`, which stays
  # Chromium-only. It builds the `cross` stage (FROM ci, plus Firefox and xvfb),
  # so the image every other service uses is unchanged. It publishes no port.
  e2e-cross:
    <<: *workspace
    build:
      context: .
      target: cross
    image: wegolite-cross
    ipc: host
    # Firefox renders more slowly than Chromium here (07-04 cadence: Chromium
    # 5.33 fps, Firefox xvfb 11.72 fps). The ratio rounds up to 1, so the waits
    # keep their default length.
    environment:
      WEGOLITE_E2E_WAIT_SCALE: "1"
    command: ["sh", "-lc", "npm run build && npm run test:e2e:cross"]

  lint:
    <<: *workspace
    command: ["npm", "run", "lint"]

  typecheck:
    <<: *workspace
    command: ["npm", "run", "typecheck"]

  assets:
    <<: *workspace
    command: ["npm", "run", "assets:build"]

  verify:
    <<: *workspace
    ipc: host
    # D-03: one fail-fast shell chain in one container. `&&` (not `;`, not
    # `set -e` with semicolons) is what makes the first failing stage
    # short-circuit. No depends_on fan-in and no orchestration script.
    # This is the fast gate (owner option B, 2026-11-08): it ends in the e2e
    # smoke subset, and the full browser suite runs in `verify-full`.
    command:
      - sh
      - -lc
      - >-
        npm run lint &&
        npm run typecheck &&
        npm run assets:check &&
        npm run test &&
        npm run build &&
        npm run test:e2e:fast

  # Release gate (owner option B, 2026-11-08): run before a release and when
  # render, input, persistence or network-guard code changes. The same D-03
  # fail-fast chain as `verify`, ending in the full Chromium suite followed by
  # the WR-04 seam spec, which builds its own test-only bundle. The Firefox
  # gate stays the separate `e2e-cross` service (D-09).
  verify-full:
    <<: *workspace
    ipc: host
    command:
      - sh
      - -lc
      - >-
        npm run lint &&
        npm run typecheck &&
        npm run assets:check &&
        npm run test &&
        npm run build &&
        npm run test:e2e &&
        npm run test:e2e:seams

volumes:
  wegolite-node-modules:
